<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script src="./js/kuroshiro.min.js"></script>
    <script src="./js/kuroshiro-analyzer-kuromoji.min.js"></script>
    <meta name="robots" content="noindex">
    <title>テキストマクロエディタ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f4f4f9;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px;
            background-color: #333;
        }
        button {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #555;
            color: #fff;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #777;
        }
        button.undo-btn {
            background-color: #d9534f;
        }
        button.undo-btn:hover {
            background-color: #c9302c;
        }
        .editor-container {
            flex: 1;
            padding: 10px;
        }
        textarea {
            width: 100%;
            height: 100%;
            padding: 12px;
            font-size: 14px;
            font-family: monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="undo-btn" onclick="undo()">元に戻す</button>
        <button onclick="processText(sortString)">ソート (文字列)</button>
        <button onclick="processText(sortNumeric)">ソート (数値)</button>
        <button onclick="processText(removeDuplicates)">重複削除</button>
        <button onclick="processText(katakanaToHiragana)">カタカナ → ひらがな</button>
        <button onclick="processText(hiraganaToKatakana)">ひらがな → カタカナ</button>
        <button onclick="processText(toFullWidth)">半角英数 → 全角</button>
        <button onclick="processText(toHalfWidth)">全角英数 → 半角</button>
        <button disabled id="convertBtn">初期化中...</button>
    </div>

    <div class="editor-container">
        <textarea id="editor" placeholder="ここにテキストを入力または貼り付けてください..."></textarea>
    </div>

    <script>
        const KuroshiroClass = window.Kuroshiro.default || window.Kuroshiro;
        const KuromojiAnalyzerClass = window.KuromojiAnalyzer.default || window.KuromojiAnalyzer;

        const kuroshiro = new KuroshiroClass();

        async function initKuroshiro() {
          try {
            await kuroshiro.init(new KuromojiAnalyzerClass({
              dictPath: "./dict"
            }));
            
            convertBtn.innerText = "ふりがな変換";
            convertBtn.disabled = false;
          } catch (err) {
            console.error("初期化エラー:", err);
          }
        }

        async function convertToRuby() {
          const text = inputText.value;
          if (!text.trim()) return;

          try {
            // mode: "furigana" で <ruby> タグ形式に変換
            // to: "hiragana" で振るルビを「ひらがな」に指定（"katakana" も可能）
            const resultHtml = await kuroshiro.convert(text, {
              mode: "furigana",
              to: "hiragana"
            });
            ret = resultHtml.replace(/<ruby>/g, "<ruby><span class=\"kanji-box\">");
            ret = ret.replace(/<rt>/g, "</span><rt>");
            ret = ret.replace(/<rp>.<\/rp>/g, "");
            const ret_array = [];
            let i = 1;
            for(let line of ret.split("\n")){
              if (line == ""){
                continue;
              }
              ret_array.push(`<li><span>${i}</span>${line}</li>`)
              i++;
            }


            resultDiv.innerHTML = ret_array.join("\n");
          } catch (err) {
            console.error("変換エラー:", err);
          }
        }

        const convertBtn = document.getElementById('convertBtn');


        const editor = document.getElementById('editor');
        let history = [];

        // 履歴を保存して変換を実行する共通関数
        function processText(transformFunction) {
            history.push(editor.value);
            editor.value = transformFunction(editor.value);
        }

        // 元に戻す
        function undo() {
            if (history.length > 0) {
                editor.value = history.pop();
            }
        }

        // ソート(文字列)
        function sortString(text) {
            return text.split('\n').sort((a, b) => a.localeCompare(b, 'ja')).join('\n');
        }

        // ソート(数値)
        function sortNumeric(text) {
            return text.split('\n').sort((a, b) => {
                const numA = parseFloat(a) || 0;
                const numB = parseFloat(b) || 0;
                return numA - numB;
            }).join('\n');
        }

        // カタカナ→ひらがな
        function katakanaToHiragana(text) {
            return text.replace(/[\u30a1-\u30f6]/g, match => 
                String.fromCharCode(match.charCodeAt(0) - 0x60)
            );
        }

        // ひらがな→カタカナ
        function hiraganaToKatakana(text) {
            return text.replace(/[\u3041-\u3096]/g, match => 
                String.fromCharCode(match.charCodeAt(0) + 0x60)
            );
        }

        // 重複削除
        function removeDuplicates(text) {
            const lines = text.split('\n');
            return [...new Set(lines)].join('\n');
        }

        // 半角英数を全角に
        function toFullWidth(text) {
            return text.replace(/[A-Za-z0-9]/g, match => 
                String.fromCharCode(match.charCodeAt(0) + 0xFEE0)
            );
        }

        // 全角英数を半角に
        function toHalfWidth(text) {
            return text.replace(/[Ａ-Ｚａ-ｚ０-９]/g, match => 
                String.fromCharCode(match.charCodeAt(0) - 0xFEE0)
            );
        }

        async function hurigana() {
          let text = editor.value;
          if (!text.trim()) return;
          history.push(text);
          try {
            // mode: "furigana" で <ruby> タグ形式に変換
            // to: "hiragana" で振るルビを「ひらがな」に指定（"katakana" も可能）
            const resultHtml = await kuroshiro.convert(text, {
              mode: "furigana",
              to: "hiragana"
            });
            ret = resultHtml.replace(/<ruby>/g, "<ruby><span class=\"kanji-box\">");
            ret = ret.replace(/<rt>/g, "</span><rt>");
            ret = ret.replace(/<rp>.<\/rp>/g, "");
            const ret_array = [];
            let i = 1;
            for(let line of ret.split("\n")){
              if (line == ""){
                continue;
              }
              ret_array.push(`<li><span>${i}</span>${line}</li>`)
              i++;
            }
           //return ret_array.join("\n");
            editor.value = ret_array.join("\n");
            history.push(text);
          } catch (err) {
            console.error("変換エラー:", err);
            return
          }
        }
        initKuroshiro();
        convertBtn.addEventListener('click', convertToRuby);
    </script>
</body>
</html>
